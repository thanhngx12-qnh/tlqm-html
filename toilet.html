<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biển Chỉ Dẫn WC (Đen Trắng - Ngang)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-family: 'Montserrat', sans-serif;
        }

        /* Nút in */
        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #000;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-radius: 4px;
            z-index: 9999;
        }
        .print-btn:hover { background-color: #333; }

        /* Định dạng trang A4 Landscape (Ngang) */
        @page {
            size: A4 landscape;
            margin: 0;
        }

        .page {
            width: 297mm; /* Chiều ngang A4 */
            height: 210mm; /* Chiều dọc A4 */
            background: white;
            margin: 20px auto;
            padding: 10mm;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            page-break-after: always;
        }

        /* --- STYLE CHUNG --- */
        .sign-border {
            width: 100%;
            height: 100%;
            border: 10px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Layout ngang: Icon trái - Chữ phải */
        .content-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 40px; 
            width: 100%;
        }

        /* Icon SVG Style */
        .wc-icon {
            width: 250px;
            height: 250px;
            fill: #000;
            flex-shrink: 0;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            border-left: 8px solid #000;
            padding-left: 40px;
            flex-grow: 1;
        }

        .sign-text-vi {
            font-size: 110pt;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 0.9;
            margin: 0;
            letter-spacing: -2px;
        }

        .sign-text-en {
            font-size: 40pt;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-top: 15px;
        }

        /* Mũi tên */
        .arrow-icon {
            width: 200px;
            height: 200px;
            fill: #000;
        }

        /* Layout riêng cho biển chỉ hướng mũi tên */
        .arrow-layout-left {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 90%;
        }
        
        .arrow-layout-right {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 90%;
        }

        @media print {
            body { background: none; }
            .print-btn { display: none; }
            .page { margin: 0; box-shadow: none; width: 297mm; height: 210mm; }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">🖨️ IN BIỂN CHỈ DẪN</button>

    <!-- 1. BIỂN NAM -->
    <div class="page">
        <div class="sign-border">
            <div class="content-row">
                <!-- Man Icon -->
                <svg class="wc-icon" viewBox="0 0 24 24">
                    <path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/>
                </svg>
                
                <div class="text-group">
                    <div class="sign-text-vi">NAM</div>
                    <div class="sign-text-en">MEN</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. BIỂN NỮ (Cập nhật icon váy chữ A chuẩn) -->
    <div class="page">
        <div class="sign-border">
            <div class="content-row">
                <svg class="wc-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="4" r="2"/>
                    <path d="M13.94 8.31C13.62 7.52 12.85 7 12 7s-1.62.52-1.94 1.31L7.5 16h3.5v6h2v-6h3.5l-2.56-7.69z"/>
                </svg>
                
                <div class="text-group">
                    <div class="sign-text-vi">NỮ</div>
                    <div class="sign-text-en">WOMEN</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. BIỂN CHUNG (Cập nhật icon nữ mới) -->
    <div class="page">
        <div class="sign-border">
            <div class="content-row">
                <!-- Unisex Icon: Man + Woman with separator -->
                <svg class="wc-icon" viewBox="0 0 48 24">
                    <!-- Man (Left) -->
                    <g transform="translate(4, 0)">
                        <path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/>
                    </g>
                    
                    <!-- Vertical Line Separator -->
                    <rect x="23" y="2" width="2" height="20" fill="#000"/>

                    <!-- Woman (Right) -->
                    <g transform="translate(24, 0)">
                        <circle cx="12" cy="4" r="2"/>
                        <path d="M13.94 8.31C13.62 7.52 12.85 7 12 7s-1.62.52-1.94 1.31L7.5 16h3.5v6h2v-6h3.5l-2.56-7.69z"/>
                    </g>
                </svg>
                
                <div class="text-group">
                    <div class="sign-text-vi" style="font-size: 75pt;">NHÀ VỆ SINH</div>
                    <div class="sign-text-en">RESTROOM</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. CHỈ DẪN TRÁI (Tăng cỡ chữ WC) -->
    <div class="page">
        <div class="sign-border">
            <div class="arrow-layout-left">
                <svg class="arrow-icon" viewBox="0 0 24 24" style="transform: rotate(180deg);">
                    <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                </svg>
                
                <div class="text-group">
                    <div class="sign-text-vi" style="font-size: 130pt;">WC</div>
                    <div class="sign-text-en" style="font-size: 50pt;">TOILET</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 5. CHỈ DẪN PHẢI (Tăng cỡ chữ WC) -->
    <div class="page">
        <div class="sign-border">
            <div class="arrow-layout-right">
                <div class="text-group" style="align-items: flex-end; text-align: right; border-left: none; border-right: 8px solid #000; padding-left: 0; padding-right: 40px;">
                    <div class="sign-text-vi" style="font-size: 130pt;">WC</div>
                    <div class="sign-text-en" style="font-size: 50pt;">TOILET</div>
                </div>

                <svg class="arrow-icon" viewBox="0 0 24 24">
                    <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                </svg>
            </div>
        </div>
    </div>

</body>
</html>
