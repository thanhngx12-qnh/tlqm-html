<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner 8/3 - Tà Lùng Quang Minh</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Framework -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* RESET & BODY */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #334155; /* Nền xám ngoài để làm nổi bật banner */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; /* Ngăn chặn cuộn trang khi scale */
        }

        /* KHUNG BANNER CHÍNH - 1200x630 */
        .banner-container {
            width: 1200px;
            height: 630px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            /* Nền Hồng Pastel gradient mềm mại */
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #fbcfe8 100%);
            display: flex;
            transform-origin: center center; /* Căn tâm khi scale */
            transition: transform 0.3s ease;
        }

        /* Họa tiết chấm bi chìm */
        .pattern-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(219, 39, 119, 0.05) 2px, transparent 2px);
            background-size: 30px 30px;
            z-index: 1;
        }

        /* Các khối màu sáng tạo chiều sâu */
        .blob-1 {
            position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.5) 0%, transparent 70%);
            top: -200px; right: -100px; border-radius: 50%; z-index: 1; filter: blur(20px);
        }
        .blob-2 {
            position: absolute; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.25) 0%, transparent 70%);
            bottom: -150px; left: 20%; border-radius: 50%; z-index: 1; filter: blur(30px);
        }

        /* Chữ 8/3 Siêu to khổng lồ chìm ở background */
        .bg-text {
            position: absolute; 
            right: 0px; /* Ép sát hoàn toàn vào lề phải */
            top: 50%; 
            transform: translateY(-50%); /* Căn giữa theo chiều dọc */
            font-family: 'Playfair Display', serif; 
            font-size: 350px; /* Thu nhỏ để vừa vặn hoàn toàn vào khoảng trống không bị che */
            font-weight: 900;
            color: rgba(255, 255, 255, 0.85); /* Tăng độ sáng để chữ bật lên rõ hơn */
            z-index: 2; 
            line-height: 1; 
            user-select: none;
            text-shadow: 0 10px 30px rgba(219, 39, 119, 0.15);
        }

        /* KHỐI NỘI DUNG CHÍNH (Glassmorphism / Thẻ kính mờ) */
        .content-card {
            width: 700px;
            height: 530px;
            margin: 50px;
            background: rgba(255, 255, 255, 0.8); /* Làm thẻ kính trong hơn 1 chút */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(219, 39, 119, 0.15);
            z-index: 10;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
        }

        /* Header: Logo & Tên Công Ty */
        .header {
            display: flex; align-items: center; gap: 20px; margin-bottom: 30px;
            padding-bottom: 15px; border-bottom: 1px solid rgba(219, 39, 119, 0.15);
        }
        
        /* Nhóm chứa 2 logo */
        .logos-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-right: 15px;
            border-right: 2px solid rgba(219, 39, 119, 0.15); /* Đường gạch mờ chia cách logo và text */
        }
        
        .logo { height: 60px; object-fit: contain; } /* Chỉnh nhỏ lại 1 chút để 2 logo không quá lấn át */
        
        .company-info { display: flex; flex-direction: column; }
        .company-name { font-size: 18px; font-weight: 800; color: #1e3a8a; text-transform: uppercase; letter-spacing: 1px; }
        .company-tag { font-size: 12px; color: #db2777; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; }

        /* Main Body: Tiêu đề & Lời chúc */
        .main-body { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        
        .pre-title {
            font-size: 14px; font-weight: 700; color: #be185d;
            text-transform: uppercase; letter-spacing: 3px;
            margin-bottom: 10px; display: flex; align-items: center; gap: 10px;
        }

        /* 8/3 Rạng Ngời */
        .title-group { margin-bottom: 25px; display: flex; align-items:baseline; }
        .title-83 { font-family: 'Playfair Display', serif; font-size: 90px; font-weight: 900; color: #be185d; line-height: 1; text-shadow: 2px 2px 0px #fbcfe8; }
        .title-script { font-family: 'Dancing Script', cursive; font-size: 75px; color: #f43f5e; margin-left: 20px; text-shadow: 2px 2px 5px rgba(0,0,0,0.05); }

        /* Slogan */
        .slogan-box {
            border-left: 4px solid #f43f5e;
            padding-left: 20px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, rgba(251, 207, 232, 0.4), transparent);
            padding-top: 15px; padding-bottom: 15px; border-radius: 0 10px 10px 0;
        }
        .slogan {
            font-size: 24px; font-weight: 800; color: #1e3a8a; /* Xanh Navy để cân bằng */
            line-height: 1.6; text-transform: uppercase; letter-spacing: 1px;
            display: flex; align-items: center; gap: 12px;
        }
        .slogan i { color: #f59e0b; font-size: 20px; }

        /* Footer */
        .footer {
            border-top: 1px dashed rgba(219, 39, 119, 0.2);
            padding-top: 20px; display: flex; justify-content: center; align-items: center;
        }
        .f-item { font-size: 15px; color: #be185d; font-weight: 600; display: flex; align-items: center; gap: 8px; font-style: italic; }
        .f-item i { color: #f43f5e; font-size: 18px; }

        /* Cánh hoa bay lơ lửng */
        .floating-icon { position: absolute; color: #f472b6; z-index: 6; opacity: 0.7; }
        .fi-1 { top: 60px; right: 450px; font-size: 28px; transform: rotate(15deg); }
        .fi-2 { bottom: 80px; right: 550px; font-size: 35px; transform: rotate(-20deg); color: #fbbf24; opacity: 0.5; }
        .fi-3 { top: 220px; left: 720px; font-size: 20px; transform: rotate(45deg); }

        /* Dành cho ảnh lỗi */
        img { display: inline-block; }

        /* =========================================
           NÚT FULLSCREEN CHUYÊN NGHIỆP
           ========================================= */
        .fullscreen-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(90deg, #db2777, #be185d);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(219, 39, 119, 0.4);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .fullscreen-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(219, 39, 119, 0.5);
            background: linear-gradient(90deg, #be185d, #9d174d);
        }

    </style>
</head>
<body>

    <div class="banner-container" id="banner">
        <!-- Nền & Họa tiết -->
        <div class="pattern-bg"></div>
        <div class="blob-1"></div>
        <div class="blob-2"></div>
        
        <!-- Chữ 8/3 khổng lồ nằm bên phải (hiển thị rõ ràng) -->
        <div class="bg-text">8/3</div>

        <!-- Các icon hoa bay lơ lửng -->
        <i class="fa-solid fa-leaf floating-icon fi-1"></i>
        <i class="fa-solid fa-star floating-icon fi-2"></i>
        <i class="fa-brands fa-pagelines floating-icon fi-3"></i>

        <!-- Khối nội dung Kính mờ -->
        <div class="content-card">
            <!-- Header có 2 logo -->
            <div class="header">
                <div class="logos-wrapper">
                    <!-- Thêm Logo Công đoàn -->
                    <img src="logo-cong-doan.png" alt="Logo Công Đoàn" class="logo">
                    <!-- Logo Công ty -->
                    <img src="Logo.png" alt="Logo Tà Lùng Quang Minh" class="logo">
                </div>
                <div class="company-info">
                    <span class="company-tag">Happy Women's Day</span>
                    <span class="company-name">Công Ty CP Tà Lùng Quang Minh</span>
                </div>
            </div>

            <!-- Body -->
            <div class="main-body">
                <div class="pre-title"><i class="fa-solid fa-gift"></i> Chúc Mừng Ngày Quốc Tế Phụ Nữ</div>
                
                <div class="title-group">
                    <span class="title-83">8/3</span>
                    <span class="title-script">Rạng Ngời</span>
                </div>

                <div class="slogan-box">
                    <div class="slogan"><i class="fa-solid fa-sparkles"></i> Cùng nhau tỏa sáng</div>
                    <div class="slogan"><i class="fa-solid fa-seedling"></i> Cùng nhau vươn xa</div>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <div class="f-item">
                    <i class="fa-solid fa-heart"></i> Kính chúc phái đẹp luôn rạng rỡ, hạnh phúc và thành công!
                </div>
            </div>
        </div>
    </div>

    <!-- Nút chức năng Fullscreen -->
    <button class="fullscreen-btn" id="fsBtn" onclick="toggleFullScreen()">
        <i class="fa-solid fa-expand"></i> <span>Xem toàn màn hình</span>
    </button>

    <!-- Kịch bản Javascript cho Scale và Fullscreen -->
    <script>
        // 1. Tự động thu phóng (Scale) Banner vừa vặn với kích thước màn hình
        function adjustScale() {
            const banner = document.getElementById('banner');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // Tính toán tỷ lệ scale để banner 1200x630 luôn hiển thị đầy đủ
            // Chia cho số lớn hơn một chút (1250 và 680) để tạo khoảng viền (padding) đẹp mắt
            const scale = Math.min(windowWidth / 1250, windowHeight / 680, 1); 
            banner.style.transform = `scale(${scale})`;
        }

        // Gọi hàm scale khi tải trang và khi kéo thả kích thước cửa sổ
        window.addEventListener('resize', adjustScale);
        window.addEventListener('DOMContentLoaded', adjustScale);

        // 2. Chức năng bật / tắt Toàn màn hình (Fullscreen API)
        const fsBtn = document.getElementById('fsBtn');
        const fsIcon = fsBtn.querySelector('i');
        const fsText = fsBtn.querySelector('span');

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Lỗi Fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Lắng nghe sự kiện thay đổi trạng thái Fullscreen để đổi Text và Icon trên nút
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fsIcon.className = 'fa-solid fa-compress';
                fsText.textContent = 'Thu nhỏ lại';
            } else {
                fsIcon.className = 'fa-solid fa-expand';
                fsText.textContent = 'Xem toàn màn hình';
            }
            
            // Cập nhật lại scale sau 100ms để đảm bảo mượt mà sau khi chuyển chế độ
            setTimeout(adjustScale, 100);
        });
    </script>

</body>
</html>
