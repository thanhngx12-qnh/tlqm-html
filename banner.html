<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Cover Option 2 - Tà Lùng Quang Minh</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f1f5f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Roboto', sans-serif;
        }

        /* KHUNG CHUẨN FACEBOOK COVER (851px x 315px) */
        .cover-container {
            width: 851px;
            height: 315px;
            position: relative;
            background-color: #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
        }

        /* --- COLORS --- */
        :root {
            --blue-dark: #003366;
            --red-brand: #FF0200;
            --white: #ffffff;
            --gray-text: #e2e8f0;
        }

        /* --- LEFT SIDE: CONTENT (60%) --- */
        .content-side {
            width: 65%; /* Mở rộng một chút để chứa phần vát chéo */
            background-color: var(--blue-dark);
            color: var(--white);
            position: relative;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
            /* Tạo hình vát chéo sang phải */
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
        }

        /* Họa tiết nền chìm bên trái */
        .bg-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 10px);
            z-index: 0;
        }

        /* --- RIGHT SIDE: IMAGE (40%) --- */
        .image-side {
            position: absolute;
            top: 0; right: 0;
            width: 45%; /* Lấn sang trái để nằm dưới lớp cắt */
            height: 100%;
            z-index: 1;
            background-color: #ccc;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Filter nhẹ để ảnh hòa hợp với thiết kế */
            filter: brightness(0.9);
        }

        /* --- DECORATIVE ELEMENTS --- */
        /* Dải đỏ trang trí - Chạy dọc theo đường cắt */
        .red-stripe {
            position: absolute;
            top: 0;
            right: 33%; /* Căn chỉnh vị trí khớp với điểm cắt */
            width: 15px;
            height: 100%;
            background-color: var(--red-brand);
            transform: skewX(-22deg); /* Nghiêng cùng góc với clip-path */
            z-index: 5;
            box-shadow: -5px 0 15px rgba(0,0,0,0.3);
        }

        /* --- CONTENT STYLING --- */
        .logo-area {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-img {
            height: 50px;
            width: auto;
            background: white;
            padding: 5px;
            border-radius: 4px;
            margin-right: 15px;
        }

        .company-name {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1.2;
            letter-spacing: 1px;
        }

        .slogan-box {
            position: relative;
            z-index: 10;
            margin-bottom: 25px;
        }

        .slogan-main {
            font-size: 30px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 5px;
        }
        
        .slogan-main span {
            color: var(--red-brand);
        }

        .slogan-sub {
            font-size: 12px;
            font-weight: 400;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-left: 3px solid var(--red-brand);
            padding-left: 10px;
        }

        /* --- NEW SERVICES STYLE (Icon + Text) --- */
        .services-list {
            position: relative;
            z-index: 10;
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .service-item {
            display: flex;
            align-items: center;
        }

        .service-icon-box {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px; /* Bo nhẹ tạo cảm giác tech */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .service-icon {
            width: 18px;
            height: 18px;
            fill: var(--red-brand);
        }

        .service-text {
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            line-height: 1.3;
            letter-spacing: 0.5px;
        }

        .contact-info {
            position: relative;
            z-index: 10;
            font-size: 10px;
            color: #cbd5e1;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Chia 2 cột cho gọn */
            gap: 5px 20px;
        }

        .contact-row {
            display: flex;
            align-items: center;
        }
        
        .icon {
            width: 12px;
            height: 12px;
            fill: var(--red-brand);
            margin-right: 6px;
        }

    </style>
</head>
<body>

    <div class="cover-container">
        
        <!-- Hình ảnh (Bên phải - Thay ảnh xe container vào src bên dưới) -->
        <div class="image-side">
            <img src="image.png" 
                 class="hero-image" 
                 alt="Logistics Background">
        </div>

        <!-- Dải đỏ trang trí -->
        <div class="red-stripe"></div>

        <!-- Nội dung (Bên trái) -->
        <div class="content-side">
            <div class="bg-pattern"></div>

            <!-- Logo & Tên -->
            <div class="logo-area">
                <img src="Logo.png" alt="Logo" class="logo-img" onerror="this.src='https://placehold.co/100x100?text=LOGO'">
                <div class="company-name">
                    CÔNG TY CỔ PHẦN<br>TÀ LÙNG QUANG MINH
                </div>
            </div>

            <!-- Slogan -->
            <div class="slogan-box">
                <div class="slogan-main">KẾT NỐI BIÊN GIỚI<br><span>VƯƠN TỚI TOÀN CẦU</span></div>
                <div class="slogan-sub">Giải pháp Logistics toàn diện & tin cậy</div>
            </div>

            <!-- Dịch vụ (Đã thiết kế lại đẹp hơn) -->
            <div class="services-list">
                <!-- Vận tải -->
                <div class="service-item">
                    <div class="service-icon-box">
                        <svg class="service-icon" viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                    </div>
                    <span class="service-text">VẬN TẢI<br>ĐƯỜNG BỘ</span>
                </div>
                <!-- Kho bãi -->
                <div class="service-item">
                    <div class="service-icon-box">
                        <svg class="service-icon" viewBox="0 0 24 24"><path d="M22 21H2v-2h1V4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v15h1v2zm-3-2V4H5v15h14zM11 8h2v2h-2V8zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2z"/></svg>
                    </div>
                    <span class="service-text">KHO BÃI<br>LOGISTICS</span>
                </div>
                <!-- Xuất nhập khẩu -->
                <div class="service-item">
                    <div class="service-icon-box">
                        <svg class="service-icon" viewBox="0 0 24 24"><path d="M9 3L5 6.99h3V14h2V6.99h3L9 3zm7 14.01V10h-2v7.01h-3L15 21l4-3.99h-3z"/></svg>
                    </div>
                    <span class="service-text">XUẤT<br>NHẬP KHẨU</span>
                </div>
            </div>

            <!-- Liên hệ -->
            <div class="contact-info">
                <div class="contact-row">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    <span>+84 96 332 03 35</span>
                </div>
                <div class="contact-row">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    <span>info@talunglogistics.com</span>
                </div>
                <div class="contact-row" style="grid-column: span 2;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    <span>Cửa khẩu Quốc tế Tà Lùng, Phục Hòa, Cao Bằng</span>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
