<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热烈欢迎中国代表团 - 越南汇运国际 (Bản Đỏ Premium)</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Noto Serif SC cho chữ thư pháp, Noto Sans SC cho chữ hiện đại, Great Vibes cho chữ uốn lượn -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0000; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Sans SC', 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* KHUNG CHÍNH */
        .banner-container {
            width: 1200px;
            height: 630px;
            position: relative;
            /* Gradient Đỏ Sáng rực rỡ và tươi tắn hơn */
            background: radial-gradient(ellipse at center, #ff1a1a 0%, #cc0000 50%, #660000 100%);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid #d4af37;
            transform-origin: center center;
            transition: transform 0.3s ease;
        }

        /* BACKGROUND EFFECTS NÂNG CẤP */
        /* Họa tiết gấm vàng chìm sang trọng */
        .bg-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffd700' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            z-index: 1;
            mix-blend-mode: overlay;
        }

        /* Ánh sáng vàng sau lưng khối kính */
        .ambient-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 1000px; height: 500px;
            background: radial-gradient(ellipse at center, rgba(255, 200, 0, 0.25) 0%, transparent 60%);
            filter: blur(50px);
            z-index: 2;
        }

        /* HẠT BỤI VÀNG BAY (ANIMATION) */
        .particles {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3; pointer-events: none;
            background-image: 
                radial-gradient(circle, #ffd700 1.5px, transparent 2.5px),
                radial-gradient(circle, #ffffff 1px, transparent 2px);
            background-size: 120px 120px, 80px 80px;
            background-position: 0 0, 40px 40px;
            animation: floatUp 30s linear infinite;
            opacity: 0.4;
        }

        @keyframes floatUp {
            0% { background-position: 0 0, 40px 40px; }
            100% { background-position: 120px -600px, 160px -400px; }
        }

        /* DẢI LỤA VÀNG BẰNG SVG */
        .ribbon-tr {
            position: absolute; top: -60px; right: -60px; width: 550px; height: 550px;
            z-index: 4; pointer-events: none;
            filter: drop-shadow(-10px 10px 15px rgba(0,0,0,0.6));
        }
        .ribbon-bl {
            position: absolute; bottom: -60px; left: -60px; width: 550px; height: 550px;
            z-index: 4; pointer-events: none; transform: rotate(180deg);
            filter: drop-shadow(-10px 10px 15px rgba(0,0,0,0.6));
        }

        /* KHỐI KÍNH MỜ TRUNG TÂM (GLASSMORPHISM) */
        .glass-panel {
            position: relative;
            z-index: 10;
            width: 1050px;
            height: 510px; /* Tăng chiều cao khối kính để chữ ở dưới không bị sát viền */
            background: rgba(20, 0, 0, 0.3); /* Kính tối màu làm nổi chữ vàng */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 4px; /* Đổi thành vuông vức sang trọng hơn */
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 40px rgba(212, 175, 55, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        /* GÓC HOA VĂN SVG TRÊN KÍNH */
        .corner-svg {
            position: absolute;
            width: 80px;
            height: 80px;
            fill: url(#goldGradient);
            z-index: 11;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .c-tl { top: 8px; left: 8px; }
        .c-tr { top: 8px; right: 8px; transform: scaleX(-1); }
        .c-bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
        .c-br { bottom: 8px; right: 8px; transform: scale(-1); }

        /* NỘI DUNG BÊN TRONG */
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            position: relative;
            z-index: 12;
        }

        .logo-img {
            height: 65px;
            background-color: #fff;
            padding: 5px;
            border-radius: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
            border: 2px solid #d4af37;
        }

        .company-name {
            font-size: 20px;
            color: #fff;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            text-transform: uppercase;
        }

        .welcome-english {
            font-family: 'Great Vibes', cursive;
            color: #ffef96;
            font-size: 52px;
            margin-bottom: 10px;
            text-shadow: 0 2px 15px rgba(255,215,0,0.6), 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 2px;
            position: relative;
            z-index: 12;
        }

        /* TEXT CHÍNH: NHIỆT LIỆT CHÀO MỪNG */
        .main-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 100px;
            font-weight: 900;
            letter-spacing: 15px;
            margin-bottom: 10px;
            
            /* Gradient Vàng Kim siêu rực rỡ */
            background: linear-gradient(to bottom, #ffffe0 0%, #ffd700 30%, #b8860b 50%, #ffd700 70%, #ffffe0 100%);
            -webkit-background-clip: text;
            color: transparent;
            
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.8)) drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
            position: relative;
            z-index: 12;
        }

        /* ĐƯỜNG KẺ NGANG ĐÁI CHỮ */
        .glowing-line {
            width: 500px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, #ffffff, #ffd700, transparent);
            margin: 15px 0 20px 0; /* Thu gọn khoảng cách ở giữa để đẩy cụm chữ dưới lên một chút */
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            position: relative;
            z-index: 12;
        }

        /* TEXT PHỤ: TÊN ĐỐI TÁC */
        .sub-title {
            text-align: center; 
            font-size: 52px; 
            font-weight: 700; 
            color: #ffd700; 
            letter-spacing: 6px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.8);
            position: relative;
            z-index: 12;
            margin: 0; /* Xóa margin mặc định */
        }

        .sub-action {
            font-size: 24px; 
            color: #ffffff; 
            letter-spacing: 8px; 
            display: block; 
            margin-top: 10px; 
            margin-bottom: 10px; /* Thêm khoảng cách ở đáy bảo vệ chữ */
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* FOOTER: ĐỊA ĐIỂM & THỜI GIAN */
        .footer-info {
            position: absolute;
            bottom: 25px;
            display: flex;
            align-items: center;
            gap: 30px;
            font-size: 16px;
            color: #ffd700;
            font-weight: 600;
            letter-spacing: 2px;
            z-index: 12;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 30px;
            border-radius: 4px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .footer-item i {
            color: #fff;
            font-size: 18px;
        }

        /* ĐỊNH NGHĨA ẨN CHO SVG */
        .svg-defs { display: none; }
    </style>
</head>
<body>

    <!-- SVG Definitions cho Dải lụa và Góc hoa văn -->
    <svg class="svg-defs">
        <defs>
            <linearGradient id="gold-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffef96" />
                <stop offset="25%" stop-color="#ffd700" />
                <stop offset="50%" stop-color="#b8860b" />
                <stop offset="75%" stop-color="#ffd700" />
                <stop offset="100%" stop-color="#8b6508" />
            </linearGradient>
            <linearGradient id="gold-ribbon-dark" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#b8860b" />
                <stop offset="50%" stop-color="#6b4c06" />
                <stop offset="100%" stop-color="#3b2b00" />
            </linearGradient>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#fff5cc;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#ffd700;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <div class="banner-container" id="banner">
        
        <!-- BACKGROUND EFFECTS -->
        <div class="bg-pattern"></div>
        <div class="ambient-glow"></div>
        <div class="particles"></div>

        <!-- DẢI LỤA VÀNG BẰNG SVG GÓC TRÊN PHẢI -->
        <svg class="ribbon-tr" viewBox="0 0 500 500">
            <path d="M 150 0 C 250 150, 400 200, 500 450 L 500 0 Z" fill="url(#gold-ribbon-dark)" opacity="0.9"/>
            <path d="M 250 0 C 350 200, 450 250, 500 500 L 500 0 Z" fill="url(#gold-ribbon)"/>
            <path d="M 0 0 C 100 80, 300 100, 500 300 L 500 0 Z" fill="none" stroke="url(#gold-ribbon)" stroke-width="8" opacity="0.7"/>
        </svg>

        <!-- DẢI LỤA VÀNG BẰNG SVG GÓC DƯỚI TRÁI -->
        <svg class="ribbon-bl" viewBox="0 0 500 500">
            <path d="M 150 0 C 250 150, 400 200, 500 450 L 500 0 Z" fill="url(#gold-ribbon-dark)" opacity="0.9"/>
            <path d="M 250 0 C 350 200, 450 250, 500 500 L 500 0 Z" fill="url(#gold-ribbon)"/>
            <path d="M 0 0 C 100 80, 300 100, 500 300 L 500 0 Z" fill="none" stroke="url(#gold-ribbon)" stroke-width="8" opacity="0.7"/>
        </svg>

        <!-- KÍNH MỜ TRUNG TÂM -->
        <div class="glass-panel">
            
            <!-- SVG Góc Hoa Văn Tân Cổ Điển -->
            <svg class="corner-svg c-tl" viewBox="0 0 100 100">
                <path d="M0,0 L40,0 Q60,0 60,20 L60,25 Q60,10 50,10 L10,10 L10,50 Q10,60 25,60 L20,60 Q0,60 0,40 Z" />
                <circle cx="20" cy="20" r="5" />
            </svg>
            <svg class="corner-svg c-tr" viewBox="0 0 100 100">
                <path d="M0,0 L40,0 Q60,0 60,20 L60,25 Q60,10 50,10 L10,10 L10,50 Q10,60 25,60 L20,60 Q0,60 0,40 Z" />
                <circle cx="20" cy="20" r="5" />
            </svg>
            <svg class="corner-svg c-bl" viewBox="0 0 100 100">
                <path d="M0,0 L40,0 Q60,0 60,20 L60,25 Q60,10 50,10 L10,10 L10,50 Q10,60 25,60 L20,60 Q0,60 0,40 Z" />
                <circle cx="20" cy="20" r="5" />
            </svg>
            <svg class="corner-svg c-br" viewBox="0 0 100 100">
                <path d="M0,0 L40,0 Q60,0 60,20 L60,25 Q60,10 50,10 L10,10 L10,50 Q10,60 25,60 L20,60 Q0,60 0,40 Z" />
                <circle cx="20" cy="20" r="5" />
            </svg>

            <!-- Branding Chủ nhà -->
            <div class="logo-area">
                <img src="Logo.png" alt="Logo" class="logo-img" onerror="this.src='https://placehold.co/80x80/ffffff/a30000?text=LOGO'">
                <div class="company-name">富英物流公司</div>
            </div>

            <!-- Lời chào tiếng Anh -->
            <div class="welcome-english">Welcome to Fuying Logistics</div>

            <!-- Chữ thư pháp chính -->
            <h1 class="main-title">热烈欢迎</h1>
            
            <!-- Đường kẻ ánh sáng -->
            <div class="glowing-line"></div>

            <!-- Tên Đối tác được chào mừng -->
            <h2 class="sub-title">
                越南汇运国际有限公司
                <span class="sub-action">采访富英物流公司</span>
            </h2>

        </div>

        <!-- THÔNG TIN ĐỊA ĐIỂM & NGÀY -->
        <div class="footer-info">
            <div class="footer-item">
                <i class="fa-solid fa-location-dot"></i>
                <span>越南 · 驼隆国际口岸</span>
            </div>
            <div class="footer-item">
                <i class="fa-regular fa-calendar-days"></i>
                <span>2026年03月26日</span>
            </div>
        </div>

    </div>

    <!-- Kịch bản Javascript -->
    <script>
        function adjustScale() {
            const banner = document.getElementById('banner');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const targetWidth = windowWidth - 40;
            const targetHeight = windowHeight - 40;

            const scale = Math.min(targetWidth / 1200, targetHeight / 630, 1.5); 
            banner.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', adjustScale);
        window.addEventListener('DOMContentLoaded', adjustScale);
    </script>

</body>
</html>
